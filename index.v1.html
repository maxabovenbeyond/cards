<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Карточки">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Карточки аналитика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: one column, phone-first; the card in the middle, answer buttons pinned to the thumb zone at the bottom */
:root {
  --bg: #eef1f4;
  --card: #ffffff;
  --ink: #17202b;
  --muted: #5d6b7a;
  --line: #d5dce4;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --again: #b3382c;
  --hard: #a86a00;
  --good: #1d7a4a;
  --chip: #e2e8ef;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --card: #18202a; --ink: #e6ecf2; --muted: #93a2b2; --line: #2a3644;
    --accent: #6ea4f0; --accent-ink: #0b1220; --again: #ef7b6f; --hard: #e0a640; --good: #5cc48e; --chip: #222c38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --card: #18202a; --ink: #e6ecf2; --muted: #93a2b2; --line: #2a3644;
  --accent: #6ea4f0; --accent-ink: #0b1220; --again: #ef7b6f; --hard: #e0a640; --good: #5cc48e; --chip: #222c38;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap {
  max-width: 640px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sync { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.counts { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; }
.counts b { color: var(--ink); font-weight: 500; }
.topics { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.topics::-webkit-scrollbar { display: none; }
.topics button {
  flex: none; font: 500 0.8rem var(--body); color: var(--ink); background: var(--chip);
  border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
.topics button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.topics button:focus-visible, .btn:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font: 500 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
.box { font: 500 0.72rem var(--mono); color: var(--muted); }
.q { font-size: 1.18rem; font-weight: 600; line-height: 1.4; margin: 0; text-wrap: pretty; }
.a { border-top: 1px dashed var(--line); padding-top: 14px; color: var(--ink); white-space: pre-line; }
.a code, .q code { font-family: var(--mono); font-size: 0.88em; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.hint { font-size: 0.82rem; color: var(--muted); }

.actions { position: sticky; bottom: 0; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: grid; gap: 8px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn {
  font: 600 0.95rem var(--body); border-radius: 12px; padding: 14px 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); min-height: 52px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.again { border-color: var(--again); color: var(--again); }
.btn.hard { border-color: var(--hard); color: var(--hard); }
.btn.good { border-color: var(--good); color: var(--good); }
.btn small { display: block; font: 500 0.7rem var(--mono); opacity: 0.8; margin-top: 2px; }

.done h2 { font-family: var(--display); font-weight: 500; font-size: 1rem; margin: 0; }
.stats { display: grid; gap: 8px; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) 110px 42px; gap: 10px; align-items: center; font-size: 0.85rem; }
.stat .bar { height: 8px; }
.stat .bar > i { background: var(--good); }
.stat span:last-child { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.legend { font-size: 0.78rem; color: var(--muted); }
footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
textarea { width: 100%; box-sizing: border-box; font: 0.78rem var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
h2.bk { font-family: var(--display); font-weight: 500; font-size: 1rem; margin: 0; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Карточки аналитика</h1>
      <span class="sync" id="sync">загрузка…</span>
    </div>
    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="topics" id="topics" role="group" aria-label="Темы"></div>
  </header>
  <main id="main"></main>
  <section class="card" id="backup" hidden>
    <h2 class="bk">Резервная копия прогресса</h2>
    <p class="legend">Скопируйте текст и сохраните, например, в Заметки. Чтобы восстановить — вставьте сохранённый текст в поле и нажмите «Восстановить».</p>
    <textarea id="backupText" rows="5" spellcheck="false" aria-label="Текст резервной копии"></textarea>
    <div class="row2">
      <button class="btn" id="copyBk" type="button">Скопировать</button>
      <button class="btn" id="restoreBk" type="button">Восстановить</button>
    </div>
    <p class="legend" id="bkMsg" aria-live="polite"></p>
  </section>
  <footer>
    <span id="foot"></span>
    <span><button class="link" id="backupBtn" type="button">Резервная копия</button></span>
    <span id="resetArea"><button class="link" id="reset" type="button">Сбросить прогресс</button></span>
  </footer>
</div>

<script>
const CARDS = [
// ---------- LLM
["llm","Что такое токен и почему русский текст дороже английского?","Кусок текста, на которые модель режет вход и выход. Цена и контекстное окно считаются в токенах.\nСловарь токенизатора в основном английский, поэтому русские слова режутся на большее число кусков — в наших опытах примерно в 1,4 раза дороже."],
["llm","Что происходит в Ollama, если диалог длиннее контекстного окна?","Ollama молча обрезает начало диалога — первым пропадает системный промпт, и модель «забывает» правила. Ошибки нет.\nПоэтому в агенте явно задавали num_ctx 8192."],
["llm","Что делает температура?","Меняет распределение вероятностей следующего токена. T = 0 — всегда самый вероятный токен: предсказуемо, но возможны повторы. Чем выше — тем разнообразнее и тем больше ошибок."],
["llm","Почему модель галлюцинирует?","Она продолжает текст правдоподобно, а не проверяет факты: нет данных — всё равно сгенерирует уверенный ответ.\nЛечится данными (RAG, инструменты) и правилом «нет доказательств — нет ответа»."],
["llm","Что такое холодный старт и keep_alive?","При первом запросе модель загружается в память — это секунды задержки. keep_alive держит её загруженной между запросами."],
["llm","Почему каждый следующий шаг агента дороже предыдущего?","Модель ничего не помнит: каждый вызов заново отправляет всю историю — промпт, сообщения, результаты инструментов. Вход растёт с каждым шагом."],
["llm","Из чего складывается стоимость вызова облачной модели?","Входные токены (промпт, история, описания инструментов — «налог» на каждый вызов) плюс выходные, которые обычно дороже. Считаем по сценариям с явными допущениями."],
["llm","Как по размеру прикинуть скорость локальной модели?","Скорость упирается в память: чем больше модель, тем медленнее. У нас 1.5b ≈ 1 ГБ → около 40 ток/с, 7b ≈ 4,5 ГБ → около 9 ток/с."],
// ---------- Инструменты
["tools","Что на самом деле происходит при вызове инструмента (function calling)?","Модель ничего не выполняет: она возвращает имя инструмента и аргументы в JSON. Выполняет приложение (хост) и возвращает результат модели."],
["tools","По чему модель выбирает инструмент и что должно быть в описании?","По имени, описанию и схеме параметров. Описание — это требование: что делает, когда использовать и когда нет, откуда брать параметры, что делать при ошибке."],
["tools","Чем format (JSON Schema) в Ollama отличается от просьбы «ответь в JSON»?","format ограничивает генерацию: JSON, нарушающий схему, невозможен — это гарантия формы. Просьба в промпте может быть нарушена.\nСодержание format не гарантирует."],
["tools","Почему плохо давать модели 20 методов API как 20 инструментов?","Чем больше выбор, тем больше ошибок и токенов. Лучше несколько узких инструментов под намерения пользователя."],
["tools","Как делить работу между кодом, моделью и человеком?","Детерминированное — коду, суждение — модели, необратимое — человеку, оценка — по правилам."],
// ---------- Агенты
["agents","Что такое шкала автономии?","Код (всё по правилам) → workflow (модель на отдельных шагах, порядок задаёт код) → агент (модель сама выбирает шаги в цикле).\nБольше свободы — больше ошибок и меньше предсказуемости."],
["agents","Как устроен агентный цикл?","Модель → вызов инструмента → результат обратно модели → снова модель… пока она не ответит или не упрётся в лимит шагов."],
["agents","Что такое guardrails? Пример из агента поддержки.","Ограничения в коде вокруг модели: лимит шагов, список инструментов, проверка параметров.\nПример: хост блокирует вызов, если номера заказа нет в тексте письма."],
["agents","Почему eval агента проверяет траекторию, а не только ответ?","Правильный ответ мог получиться неправильным путём: лишний вызов или вызов с ошибкой. Eval должен видеть, какие инструменты вызваны и успешно ли."],
["agents","Чем «костыль» отличается от «защиты»?","Костыль компенсирует слабость модели (номер только из письма, ответ из шаблонов) — с сильной моделью его можно снять.\nЗащита и правила бизнеса нужны при любой модели: проверка владельца, права БД, 14 дней в коде."],
["agents","Что делает оркестратор?","Делит задачу на подзадачи, запускает каждую с чистым контекстом и собирает результат."],
["agents","Что такое «человек в цикле»?","Человек одобряет рискованные или необратимые действия и черновики ответов до отправки."],
// ---------- MCP
["mcp","Зачем нужен MCP?","Единый стандарт подключения инструментов к ИИ-приложениям: N приложений + M сервисов вместо N×M интеграций. Как USB-C."],
["mcp","Хост, клиент, сервер — кто есть кто?","Хост — приложение-распорядитель (Claude Desktop, наш agent.py): держит модель и решает. Клиент — соединение хоста с одним сервером. Сервер — даёт инструменты и данные.\nМодель — не хост."],
["mcp","На каком протоколе работает MCP и какие основные методы?","JSON-RPC 2.0: initialize, tools/list, tools/call, плюс уведомления."],
["mcp","Какие есть транспорты MCP?","stdio — сервер запускается дочерним процессом, логи только в stderr.\nStreamable HTTP — удалённый сервер, авторизация OAuth 2.1."],
["mcp","Ошибка протокола или isError — в чём разница?","Ошибка протокола — сломан сам запрос (нет такого метода). isError — инструмент отработал, но с ошибкой бизнес-уровня; модель её видит и может исправиться."],
["mcp","Что такое аннотации инструментов и защищают ли они?","readOnlyHint, destructiveHint, idempotentHint, openWorldHint — подсказки хосту, что спрашивать у человека. Это подсказки, а не защита."],
["mcp","Какие угрозы характерны для MCP?","Отравление описаний инструментов, подмена описания после одобрения, затенение чужих инструментов, confused deputy — передача полученного токена дальше."],
["mcp","Почему sender_email скрыт от модели?","Хост берёт адрес из заголовка From и подставляет сам. Модель параметра не видит и не может подменить его по тексту письма."],
// ---------- RAG
["rag","Что такое RAG?","Поиск нужных фрагментов документов → вставка их в промпт → ответ модели по ним. Модель — читатель, а не источник знаний."],
["rag","Почему не положить все документы в промпт и не дообучить модель?","Всё в промпт: не влезет в окно, дорого на каждый вызов, середину модель видит хуже.\nДообучение: дорого, устаревает при смене правил, не даёт ссылку на источник."],
["rag","Что такое эмбеддинг?","Вектор чисел (у bge-m3 — 1024): близкие по смыслу тексты получают близкие векторы. Считает отдельная модель эмбеддингов, не языковая."],
["rag","Что такое косинусное расстояние?","Угол между векторами: 0 — смысл совпадает, чем больше — тем дальше. Длина вектора не важна. В pgvector — оператор <=>."],
["rag","Почему nomic-embed-text не подошла, а bge-m3 подошла?","nomic обучена в основном на английском: «штаны — брюки» дальше несвязанных фраз, «магнит», порог невозможен.\nbge-m3 многоязычная: синонимы близко, отрыв верного ответа в 5–10 раз больше."],
["rag","Чего не умеет поиск по смыслу при любой модели?","Различать отрицание («можно» ≈ «нельзя»), точные названия и числа (Казань ≈ Новосибирск), говорить «ничего нет».\nРешения: модель читает фрагмент целиком, гибридный поиск по словам, порог + правило «не знаю»."],
["rag","Как правильно резать документы на фрагменты?","По смысловым единицам: один пункт — один фрагмент, понятный сам по себе. Слишком крупно — смысл размывается, слишком мелко — теряется контекст и появляются «магниты»."],
["rag","Что делает pgvector, а чего не делает?","Даёт тип vector(N), операторы расстояния и индексы HNSW / IVFFlat.\nВекторы не считает: их считает модель эмбеддингов, а приложение вставляет в базу."],
["rag","Как работает индекс HNSW и в чём подвох?","Граф «знакомств» соседей: поиск переходит к ближайшему знакомому. Индекс приближённый.\nКласс операторов должен совпадать с оператором поиска (vector_cosine_ops ↔ <=>), иначе индекс молча не используется."],
["rag","Зачем шаблон «актуальная таблица + история» для правил?","Поиск физически не видит старые правила — не нужен WHERE is_active в каждом запросе. Старые версии уходят в архив триггером, без векторов."],
["rag","Почему вопрос с несколькими темами плохо находится?","Вопрос превращается в один вектор — «среднее» тем — и оказывается между ними. Решения: больше фрагментов (top-5) или разбить письмо на подвопросы."],
// ---------- Eval и требования
["eval","Зачем eval и когда его прогонять?","Чтобы измерять качество на наборе примеров с ожидаемым результатом. Любая правка промпта — повод прогнать весь eval: v0.4 исправила одни письма и сломала другие."],
["eval","Чем eval поиска отличается от eval ответа?","Поиск: нашёлся ли нужный фрагмент (top-1, top-3). Ответ: верен ли текст по найденному. Это разные модели и разные ошибки: хороший поиск не гарантирует хороший ответ."],
["eval","Почему «проверку нужно проверять»?","Eval тоже ошибается: засчитал вызов с ошибкой как успех; must пропустил лишнее «пришлите фото». Нужны негативные случаи и must_not."],
["eval","Как выбрать порог «ответа нет»?","По цене ошибок: ложное «не знаю» уходит человеку (безопасно), ложный ответ вредит клиенту. Порог ставят со стороны осторожности."],
["eval","Сколько примеров нужно в eval?","6 писем — одно письмо = 17% метрики. Для решений нужно 20–30 и больше, включая сложные и без ответа; лучше реальные."],
["eval","Зачем сравнивать ИИ с базовым вариантом?","Без сравнения с решением без ИИ (правила, код, человек) непонятно, нужен ли ИИ вообще и что он даёт."],
["eval","Как внедрять ИИ-ответы клиентам по шагам?","Черновик + одобрение сотрудником → измерение на реальных письмах → автоотправка по темам с нулевыми ошибками. Самое рискованное — последним."],
// ---------- Безопасность
["sec","Что такое внедрение инструкций (prompt injection)?","Инструкции, спрятанные в данных — письме, документе, странице, — которые модель может принять за команды. Надёжно отличать данные от инструкций модель не умеет."],
["sec","Какая главная защита от внедрения инструкций?","Не давать модели полномочий, которые нельзя доверить автору данных: наименьшие привилегии, параметры безопасности заполняет код, рискованное — через человека."],
["sec","Как принцип наименьших привилегий применён в shop-ai?","Отдельные роли: support_agent только читает нужное и пишет заявки; права до уровня столбца; addresses не выдана. Индексатор не видит архив правил."],
["sec","Почему чужой и несуществующий заказ дают одинаковый NOT_FOUND?","Иначе перебором номеров можно узнать, какие заказы существуют."],
// ---------- Базы данных
["db","Концептуальная, логическая и физическая модель — в чём разница?","Концептуальная: сущности и связи. Логическая: таблицы, ключи, атрибуты. Физическая: типы, индексы, ограничения под конкретную СУБД."],
["db","Зачем суррогатный ключ?","Искусственный id (GENERATED ALWAYS AS IDENTITY) не зависит от бизнес-данных, которые могут меняться (email, артикул)."],
["db","Почему деньги хранят в numeric, а не в float?","float хранит двоичные приближения — копейки «плывут». numeric точен."],
["db","Зачем timestamptz?","Хранит момент времени с учётом часового пояса. timestamp без зоны неоднозначен, когда системы в разных поясах."],
["db","Зачем хранить unit_price в позиции заказа и адрес в заказе?","Это снимки: цена и адрес меняются, а заказ должен хранить то, что было на момент покупки."],
["db","ON DELETE RESTRICT или CASCADE — когда что?","RESTRICT не даст удалить родителя с детьми (клиента с заказами). CASCADE удалит детей вместе с ним (позиции вместе с заказом)."],
["db","Что такое частичный уникальный индекс? Пример.","UNIQUE с условием WHERE. «У клиента один адрес по умолчанию»: UNIQUE (customer_id) WHERE is_default."],
["db","Нужно ли создавать индекс на внешний ключ?","Да: PostgreSQL сам его не создаёт. Без него JOIN и удаление родителя медленные."],
["db","Зачем COMMENT ON?","Документация прямо в базе: пригодится людям и text-to-SQL, который по комментариям понимает смысл таблиц."],
["db","Что такое BEFORE-триггер и в чём была ловушка с content_hash?","Функция, которая срабатывает до изменения строки. Вычисляемые столбцы в NEW там ещё NULL, а сравнение с NULL — «неизвестно», поэтому сравнивать надо исходные поля."],
// ---------- API и интеграции
["api","Методы REST: что делает каждый?","GET читает, POST создаёт, PUT заменяет целиком, PATCH меняет часть, DELETE удаляет."],
["api","Что такое идемпотентность? Какие методы идемпотентны?","Повтор запроса даёт тот же результат. GET, PUT, DELETE — да; POST — нет (два заказа). Для POST применяют ключ идемпотентности."],
["api","Коды ответов 4xx и 5xx: что значат основные?","4xx — ошибка клиента: 400 неверный запрос, 401 не аутентифицирован, 403 нет прав, 404 нет ресурса, 409 конфликт, 422 не прошла проверка данных.\n5xx — ошибка сервера."],
["api","Что такое OpenAPI и Swagger?","OpenAPI — описание API в YAML/JSON: пути, методы, параметры, схемы ответов, коды. Swagger — инструменты вокруг него (редактор, UI)."],
["api","Что такое контрактное тестирование?","Проверка, что реальный API отвечает так, как обещано в спецификации. Проверки выводятся из OpenAPI механически (например, Schemathesis)."],
["api","REST или Kafka — когда что?","REST — синхронный запрос-ответ «здесь и сейчас». Kafka — асинхронные события в журнале: отправитель не ждёт, получатели читают в своём темпе и могут перечитать."],
["api","Polling или webhook?","Polling: клиент сам периодически спрашивает. Webhook: сервер сам присылает событие на ваш адрес — нужен публичный HTTPS."],
["api","Аутентификация или авторизация?","Аутентификация — кто ты (логин, токен). Авторизация — что тебе можно (права)."],
["api","Какие бывают способы интеграции систем?","Синхронные вызовы (REST, gRPC), события и очереди (Kafka), обмен файлами (CSV через S3, FTP), общая база (нежелательно). Выбор — по срочности, объёму и связанности систем."],
// ---------- Docker
["docker","Образ или контейнер?","Образ — рецепт и замороженные продукты. Контейнер — запущенный экземпляр по рецепту: его можно выбросить и создать заново, образ останется."],
["docker","Что такое том (volume) и чем опасен down -v?","Данные вне контейнера: переживают его пересоздание. docker compose down -v удаляет тома вместе с данными."],
["docker","Что значит localhost внутри контейнера?","Сам контейнер. Сосед по compose — по имени сервиса (db:5432), программа на компьютере — host.docker.internal (так мы достаём Ollama)."],
["docker","Что значит 127.0.0.1:5434:5432 в ports?","Порт 5434 компьютера ведёт в порт 5432 контейнера, и доступ только с этого компьютера."],
["docker","Почему миграция 004 не применилась сама?","Скрипты из docker-entrypoint-initdb.d выполняются только при первом создании базы, на пустом томе. Новые миграции применяют вручную."],
// ---------- Системный анализ
["sa","Как выглядит хорошая user story?","Как <роль>, я хочу <действие>, чтобы <ценность>. Роль — реальный пользователь, а не система или разработчик; в действии нет технического решения."],
["sa","Какие нефункциональные требования важны для LLM-решения?","Время ответа, цена за обращение, доля ошибок и цена каждой ошибки, где хранятся и обрабатываются данные (152-ФЗ), поведение при недоступности модели."],
["sa","BPMN или диаграмма последовательности?","BPMN — бизнес-процесс: кто что делает и в каком порядке. Диаграмма последовательности — какие системы какими вызовами обмениваются во времени."],
["sa","Почему 152-ФЗ важен при выборе модели?","Персональные данные россиян: отправка в зарубежную модель — трансграничная передача. Отсюда локальные модели или GigaChat / YandexGPT."],
["sa","Что показали правила магазина, записанные текстом?","Расхождения с кодом: задержка по городам против единых 7 дней, брак 60 дней против проверки 14 дней. Нужен единый источник правил."]
];
const TOPICS = { llm: "LLM", tools: "Инструменты", agents: "Агенты", mcp: "MCP", rag: "RAG", eval: "Eval", sec: "Безопасность", db: "Базы данных", api: "API", docker: "Docker", sa: "Системный анализ" };
const INTERVAL = { 1: 1, 2: 3, 3: 7, 4: 16, 5: 35, 6: 60 };   // дней до следующего показа для каждой коробки
const NEW_PER_DAY = 10;
const LS_KEY = "analyst-cards-v1";

// Идентификатор карточки — тема + номер внутри темы: стабилен, пока порядок не меняется
const cards = [];
{ const n = {}; for (const [t, q, a] of CARDS) { n[t] = (n[t] || 0) + 1; cards.push({ id: t + "-" + n[t], t, q, a }); } }

const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); };

// ---------- Состояние: { c: {id: {b, d, t}}, newDay, newCount }
let state = { c: {}, newDay: 0, newCount: 0 };
let filter = "all";
let queue = [], current = null, revealed = false, doneToday = 0, extraNew = 0;

let loadLocalOk = true;
function loadLocal() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { loadLocalOk = false; } try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.c) return s; } catch (e) {} return null; }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

function merge(a, b) {               // по каждой карточке берём более свежую запись
  const out = { c: { ...a.c } };
  for (const [id, v] of Object.entries(b.c || {})) if (!out.c[id] || (v.t || 0) > (out.c[id].t || 0)) out.c[id] = v;
  const ad = a.newDay || 0, bd = b.newDay || 0;
  if (ad === bd) { out.newDay = ad; out.newCount = Math.max(a.newCount || 0, b.newCount || 0); }
  else if (ad > bd) { out.newDay = ad; out.newCount = a.newCount || 0; }
  else { out.newDay = bd; out.newCount = b.newCount || 0; }
  return out;
}

// ---------- Хранение: только на этом устройстве (localStorage)
const syncEl = document.getElementById("sync");
function scheduleWrite() {}
function connect() { syncEl.textContent = loadLocalOk ? "прогресс на этом устройстве" : "прогресс не сохранится: включите сайты в настройках Safari"; }

// ---------- Очередь на сегодня
function inFilter(c) { return filter === "all" || c.t === filter; }
function newLeft() {
  if (state.newDay !== today()) { state.newDay = today(); state.newCount = 0; }
  return Math.max(0, NEW_PER_DAY + extraNew - state.newCount);
}
function rebuild() {
  const d = today();
  const due = shuffle(cards.filter(c => inFilter(c) && state.c[c.id] && state.c[c.id].d <= d));
  const fresh = shuffle(cards.filter(c => inFilter(c) && !state.c[c.id])).slice(0, newLeft());
  queue = [...due, ...fresh];
  current = queue.shift() || null;
  revealed = false;
  render();
}

function grade(g) {
  if (!current) return;
  const now = Date.now(), d = today();
  const prev = state.c[current.id];
  const b = prev ? prev.b : 0;
  if (!prev) { if (state.newDay !== d) { state.newDay = d; state.newCount = 0; } state.newCount++; }
  let nb, nd;
  if (g === "again") { nb = 1; nd = d; queue.push(current); }                 // покажем ещё раз в этой сессии
  else if (g === "hard") { nb = Math.max(1, b); nd = d + (nb <= 1 ? 1 : Math.ceil(INTERVAL[nb] / 2)); }
  else { nb = b === 0 ? 2 : Math.min(6, b + 1); nd = d + INTERVAL[nb]; }
  state.c[current.id] = { b: nb, d: nd, t: now };
  if (g !== "again") doneToday++;
  saveLocal(); scheduleWrite();
  current = queue.shift() || null;
  revealed = false;
  render();
}

// ---------- Отрисовка
const main = document.getElementById("main");
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderTopics() {
  const box = document.getElementById("topics");
  box.textContent = "";
  for (const [k, name] of [["all", "Все темы"], ...Object.entries(TOPICS)]) {
    const b = el("button", null, name);
    b.type = "button";
    b.setAttribute("aria-pressed", String(filter === k));
    b.addEventListener("click", () => { filter = k; renderTopics(); rebuild(); });
    box.appendChild(b);
  }
}

function renderHeader() {
  const d = today();
  const seen = Object.keys(state.c).length;
  const learned = Object.values(state.c).filter(v => v.b >= 4).length;
  const left = (current ? 1 : 0) + queue.length;
  const total = left + doneToday;
  document.getElementById("bar").style.width = total ? Math.round(doneToday / total * 100) + "%" : "100%";
  const counts = document.getElementById("counts");
  counts.textContent = "";
  const add = (label, n) => { const s = el("span"); s.append(label + " "); s.appendChild(el("b", null, String(n))); counts.appendChild(s); };
  add("осталось", left); add("сделано", doneToday); add("начато", seen + "/" + cards.length); add("освоено", learned);
  const tomorrow = Object.values(state.c).filter(v => v.d === d + 1).length;
  document.getElementById("foot").textContent = "Завтра к повтору: " + tomorrow;
}

function render() {
  renderHeader();
  main.textContent = "";
  if (!current) return renderDone();
  const card = el("section", "card");
  card.setAttribute("aria-live", "polite");
  const meta = el("div", "meta");
  meta.appendChild(el("span", "tag", TOPICS[current.t]));
  const st = state.c[current.id];
  meta.appendChild(el("span", "box", st ? "уровень " + st.b + " из 6" : "новая"));
  card.appendChild(meta);
  card.appendChild(el("p", "q", current.q));
  if (revealed) card.appendChild(el("div", "a", current.a));
  else card.appendChild(el("p", "hint", "Сначала ответьте про себя или вслух — потом откройте ответ."));
  main.appendChild(card);

  const actions = el("div", "actions");
  if (!revealed) {
    const show = el("button", "btn primary", "Показать ответ");
    show.type = "button"; show.id = "show";
    show.addEventListener("click", () => { revealed = true; render(); });
    actions.appendChild(show);
  } else {
    const row = el("div", "row3");
    const b = st ? st.b : 0;
    const hardDays = Math.max(1, b) <= 1 ? 1 : Math.ceil(INTERVAL[Math.max(1, b)] / 2);
    const goodDays = INTERVAL[b === 0 ? 2 : Math.min(6, b + 1)];
    for (const [g, label, when] of [["again", "Не вспомнил", "сейчас"], ["hard", "С трудом", "через " + hardDays + " " + plural(hardDays, "день", "дня", "дней")], ["good", "Вспомнил", "через " + goodDays + " " + plural(goodDays, "день", "дня", "дней")]]) {
      const btn = el("button", "btn " + g);
      btn.type = "button";
      btn.append(label);
      btn.appendChild(el("small", null, when));
      btn.addEventListener("click", () => grade(g));
      row.appendChild(btn);
    }
    actions.appendChild(row);
  }
  main.appendChild(actions);
}

function renderDone() {
  const card = el("section", "card done");
  card.appendChild(el("h2", null, doneToday ? "На сегодня всё — " + doneToday + " " + plural(doneToday, "карточка", "карточки", "карточек") : "Сейчас повторять нечего"));
  const notSeen = cards.filter(c => inFilter(c) && !state.c[c.id]).length;
  card.appendChild(el("p", "legend", "Освоено — карточки на уровне 4 и выше (интервал от 16 дней). Повторённые карточки вернутся сами, когда подойдёт их срок."));
  const stats = el("div", "stats");
  for (const [k, name] of Object.entries(TOPICS)) {
    const list = cards.filter(c => c.t === k);
    const learned = list.filter(c => state.c[c.id] && state.c[c.id].b >= 4).length;
    const seen = list.filter(c => state.c[c.id]).length;
    const row = el("div", "stat");
    row.appendChild(el("span", null, name));
    const bar = el("div", "bar"); const fill = el("i"); fill.style.width = Math.round(learned / list.length * 100) + "%";
    bar.appendChild(fill);
    row.appendChild(bar);
    const num = el("span", null, learned + "/" + list.length);
    num.title = "начато " + seen;
    row.appendChild(num);
    stats.appendChild(row);
  }
  card.appendChild(stats);
  main.appendChild(card);
  if (notSeen) {
    const actions = el("div", "actions");
    const more = el("button", "btn primary", "Ещё 10 новых карточек");
    more.type = "button"; more.id = "more";
    more.addEventListener("click", () => { extraNew += 10; rebuild(); });
    actions.appendChild(more);
    main.appendChild(actions);
  }
}

// ---------- Сброс с подтверждением на странице
const resetArea = document.getElementById("resetArea");
function bindReset() {
  document.getElementById("reset").addEventListener("click", () => {
    resetArea.textContent = "";
    const box = el("span", "confirm");
    box.append("Удалить весь прогресс? ");
    const yes = el("button", "link", "Да, сбросить"); yes.type = "button";
    const no = el("button", "link", "Отмена"); no.type = "button";
    yes.addEventListener("click", () => { state = { c: {}, newDay: today(), newCount: 0 }; doneToday = 0; extraNew = 0; saveLocal(); scheduleWrite(); restoreReset(); rebuild(); });
    no.addEventListener("click", restoreReset);
    box.append(yes, " · ", no);
    resetArea.appendChild(box);
  });
}
function restoreReset() { resetArea.textContent = ""; const b = el("button", "link", "Сбросить прогресс"); b.type = "button"; b.id = "reset"; resetArea.appendChild(b); bindReset(); }
bindReset();

// Клавиатура: пробел — показать ответ, 1/2/3 — оценка
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button") && e.key === " ") return;
  if (!current) return;
  if (!revealed && (e.key === " " || e.key === "Enter")) { e.preventDefault(); revealed = true; render(); }
  else if (revealed && ["1", "2", "3"].includes(e.key)) grade(["again", "hard", "good"][+e.key - 1]);
});

// Резервная копия
const bk = document.getElementById("backup"), bkText = document.getElementById("backupText"), bkMsg = document.getElementById("bkMsg");
document.getElementById("backupBtn").addEventListener("click", () => {
  bk.hidden = !bk.hidden;
  if (!bk.hidden) { bkText.value = JSON.stringify(state); bkMsg.textContent = ""; bk.scrollIntoView({ behavior: "smooth" }); }
});
document.getElementById("copyBk").addEventListener("click", () => {
  bkText.value = JSON.stringify(state);
  const ok = () => { bkMsg.textContent = "Скопировано. Сохраните текст в Заметки."; };
  if (navigator.clipboard) navigator.clipboard.writeText(bkText.value).then(ok, () => { bkText.select(); bkMsg.textContent = "Текст выделен — скопируйте его вручную."; });
  else { bkText.select(); bkMsg.textContent = "Текст выделен — скопируйте его вручную."; }
});
document.getElementById("restoreBk").addEventListener("click", () => {
  try {
    const data = JSON.parse(bkText.value);
    if (!data || typeof data.c !== "object") throw new Error();
    state = merge(state, data); saveLocal(); doneToday = 0; rebuild();
    const n = Object.keys(state.c).length; bkMsg.textContent = "Восстановлено: прогресс по " + n + " " + plural(n, "карточке", "карточкам", "карточкам") + ".";
  } catch (e) { bkMsg.textContent = "Не получилось: вставьте текст резервной копии целиком."; }
});

state = loadLocal() || state;
renderTopics();
rebuild();
connect();
</script>

</body>
</html>
